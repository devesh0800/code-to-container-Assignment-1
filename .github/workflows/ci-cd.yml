name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Fetch from GitHub (Checkout code)
      - name: Fetch from GitHub
        uses: actions/checkout@v3
        
      # Step 2: Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      # Step 3: Build Application
      - name: Build Application
        run: |
          echo "Installing dependencies..."
          npm install
          echo "Application build successful ✓"
          
      # Step 4: Run basic application test
      - name: Test Application
        run: |
          echo "Testing application..."
          node -e "require('./app.js')" &
          sleep 2
          echo "Application test passed ✓"
          
      # Step 5: Setup Docker Buildx for building images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      # Step 6: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      # Step 7: Create Docker Image
      - name: Build and Create Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/devops-app:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/devops-app:latest
          outputs: type=docker,dest=/tmp/image.tar
          
      # Step 8: Push Image to Docker Hub
      - name: Push Image to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/devops-app:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/devops-app:latest
          
      # Step 9: Print Completion Message
      - name: Success Notification
        run: |
          echo "✓ Application fetched from GitHub"
          echo "✓ Application built successfully"
          echo "✓ Docker image created"
          echo "✓ Image pushed to Docker Hub"
          echo "Pipeline completed successfully! 🚀"
